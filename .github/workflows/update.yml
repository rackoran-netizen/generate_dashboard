name: Update Dashboard

on:
  schedule:
    - cron: '0 1 * * *'   # 08:00 Bangkok (UTC+7)
  workflow_dispatch:        # กดปุ่มรันเองได้จาก GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run scraper
        env:
          JETTS_USERNAME: ${{ secrets.JETTS_USERNAME }}
          JETTS_PASSWORD: ${{ secrets.JETTS_PASSWORD }}
        run: python scraper.py

      - name: Generate dashboard
        run: python generate_dashboard.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json index.html
          git diff --cached --quiet || git commit -m "update: $(date +'%d/%m/%Y %H:%M') UTC+7"
          git push
